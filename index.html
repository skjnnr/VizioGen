<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viziogen – AI images, thumbnails & logos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ecebf5;--ink:#16131f;--panel:#fff;--accent:#3b3bff;--hi:#ffe14d;--line:#d6d3e6;--mute:#6a6680}
@media(prefers-color-scheme:dark){:root{--bg:#14121d;--ink:#f1effa;--panel:#1d1a2a;--line:#34304a;--mute:#9b97b5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
header{padding:28px 24px 8px;max-width:1200px;margin:auto}
h1{margin:0;font-size:clamp(2rem,5vw,3.4rem);font-weight:800;letter-spacing:-.03em;line-height:1}
h1 mark{background:var(--hi);color:#16131f;padding:0 .15em}
header p{margin:10px 0 0;color:var(--mute);max-width:56ch}
main{max-width:1200px;margin:auto;padding:16px 24px 48px;display:grid;grid-template-columns:380px 1fr;gap:24px}
@media(max-width:860px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px;align-self:start}
label{font-weight:600;font-size:.9rem;display:block;margin-bottom:6px}
textarea,select,input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:110px;resize:vertical}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg,.chips{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chips button{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 12px;border-radius:999px;font:inherit;font-size:.88rem;cursor:pointer}
.seg button[aria-pressed=true],.chips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:14px;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-height:340px;display:flex;flex-direction:column;gap:12px}
.canvas{flex:1;display:grid;place-items:center;border-radius:10px;min-height:300px;background:repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 0 0/20px 20px;overflow:hidden}
.canvas img{max-width:100%;max-height:70vh;display:block}
.empty{color:var(--mute);text-align:center;padding:24px;background:var(--panel);border-radius:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bar button,.bar a{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 14px;border-radius:8px;text-decoration:none;font:inherit;font-size:.9rem;cursor:pointer}
.hist{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.hist img{height:70px;border-radius:6px;cursor:pointer;border:2px solid transparent}
.hist img:hover{border-color:var(--accent)}
.err{color:#d43b3b;font-size:.9rem}
.hint{font-size:.8rem;color:var(--mute)}
@media(prefers-reduced-motion:no-preference){.spin{animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}}
</style>
</head>
<body>
<header>
  <h1>Viziogen: <mark>any image</mark>, any detail.</h1>
  <p>Describe what you want. Pick a format and style. Get a picture, thumbnail or logo you can download.</p>
</header>
<main>
  <section class="panel" aria-label="Controls">
    <div>
      <label for="prompt">What should it show?</label>
      <textarea id="prompt" placeholder="e.g. A red fox astronaut planting a flag on a neon purple moon, big bold title text 'MOON FOX'"></textarea>
    </div>
    <div>
      <label id="lf">Format</label>
      <div class="seg" id="format" role="group" aria-labelledby="lf"></div>
    </div>
    <div>
      <label id="ls">Style</label>
      <div class="chips" id="style" role="group" aria-labelledby="ls"></div>
    </div>
    <div>
      <label id="ld">Extra detail (pick any)</label>
      <div class="chips" id="details" role="group" aria-labelledby="ld"></div>
    </div>
    <div>
      <label for="neg">Avoid (optional)</label>
      <input id="neg" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit" placeholder="blurry, extra fingers, watermark">
    </div>
    <div class="row">
      <div><label for="model">Model</label>
        <select id="model"><option value="flux">Flux (best quality)</option><option value="turbo">Turbo (fast)</option><option value="gptimage">GPT Image</option></select></div>
      <div><label for="seed">Seed</label><input id="seed" type="number" placeholder="random"></div>
    </div>
    <button class="go" id="go">Generate</button>
    <div class="err" id="err" role="alert"></div>
    <p class="hint">Images are made by the free Pollinations service. Prompts are sent to it, so don't include private information.</p>
  </section>

  <section class="stage" aria-label="Result">
    <div class="canvas" id="canvas"><div class="empty">Your image will appear here.</div></div>
    <div class="bar" id="bar" hidden>
      <button id="dl">Download PNG</button>
      <a id="open" target="_blank" rel="noopener">Open full size</a>
      <button id="again">New variation</button>
    </div>
    <div class="hist" id="hist" aria-label="Recent images"></div>
  </section>
</main>
<script>
// ---- Config: change API_BASE if you want to use a different provider ----
const API_BASE = "https://image.pollinations.ai/prompt/";

const FORMATS = {
  "Image":      {w:1024,h:1024,pre:""},
  "Thumbnail":  {w:1280,h:720, pre:"YouTube thumbnail, 16:9, eye-catching, high contrast, bold readable text, expressive focal subject, vibrant colors, clean composition, "},
  "Logo":       {w:1024,h:1024,pre:"professional vector logo design, flat, centered on plain solid background, simple memorable shape, scalable, no mockup, "},
  "Banner":     {w:1500,h:500, pre:"wide banner, "},
  "Portrait":   {w:768, h:1152,pre:""},
  "Phone wallpaper":{w:720,h:1280,pre:""}
};
const STYLES = ["None","Photorealistic","3D render","Anime","Watercolor","Oil painting","Minimal flat","Cyberpunk","Retro 80s","Pixel art","Line art","Comic book","Vintage poster","Gradient glass"];
const DETAILS = ["Ultra detailed","Dramatic lighting","Cinematic","Bokeh","Golden hour","Neon glow","Studio lighting","Macro close-up","Wide angle","Symmetrical","Textured grain","8K"];

const $ = id => document.getElementById(id);
let fmt = "Image", style = "None", details = new Set(), current = null;

function pills(root, items, onClick, pressedFn){
  root.innerHTML = "";
  items.forEach(t => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = t;
    b.setAttribute("aria-pressed", pressedFn(t));
    b.onclick = () => { onClick(t); [...root.children].forEach(c => c.setAttribute("aria-pressed", pressedFn(c.textContent))); };
    root.appendChild(b);
  });
}
pills($("format"), Object.keys(FORMATS), t => fmt = t, t => t === fmt);
pills($("style"), STYLES, t => style = t, t => t === style);
pills($("details"), DETAILS, t => details.has(t) ? details.delete(t) : details.add(t), t => details.has(t));

function buildUrl(seed){
  const f = FORMATS[fmt];
  let p = f.pre + $("prompt").value.trim();
  if (style !== "None") p += ", " + style + " style";
  if (details.size) p += ", " + [...details].join(", ");
  const neg = $("neg").value.trim();
  const q = new URLSearchParams({width:f.w,height:f.h,seed,model:$("model").value,nologo:"true",enhance:"false"});
  if (neg) q.set("negative_prompt", neg);
  return API_BASE + encodeURIComponent(p) + "?" + q;
}

function generate(forceNewSeed){
  $("err").textContent = "";
  if (!$("prompt").value.trim()) { $("err").textContent = "Describe what you want to see first."; return; }
  const seed = (!forceNewSeed && $("seed").value) ? $("seed").value : Math.floor(Math.random()*1e9);
  const url = buildUrl(seed);
  const btn = $("go"); btn.disabled = true; btn.textContent = "Generating…";
  $("canvas").innerHTML = '<div class="empty"><span class="spin" style="display:inline-block">◐</span> Making your image. This can take 10–30 seconds.</div>';
  const img = new Image();
  img.alt = $("prompt").value.trim();
  img.onload = () => {
    $("canvas").innerHTML = ""; $("canvas").appendChild(img);
    current = {url, name: "viziogen-" + seed + ".png"};
    $("open").href = url; $("bar").hidden = false;
    addHist(url); btn.disabled = false; btn.textContent = "Generate";
  };
  img.onerror = () => {
    $("canvas").innerHTML = '<div class="empty">No image yet.</div>';
    $("err").textContent = "The image service didn't respond. Wait a moment and press Generate again, or try the Turbo model.";
    btn.disabled = false; btn.textContent = "Generate";
  };
  img.src = url;
}

function addHist(url){
  const t = document.createElement("img"); t.src = url; t.alt = "Earlier result";
  t.onclick = () => { $("canvas").innerHTML = ""; const i = new Image(); i.src = url; $("canvas").appendChild(i); $("open").href = url; current = {url, name:"viziogen.png"}; };
  $("hist").prepend(t);
}

$("go").onclick = () => generate(false);
$("again").onclick = () => { $("seed").value = ""; generate(true); };
$("dl").onclick = async () => {
  if (!current) return;
  try {
    const blob = await (await fetch(current.url)).blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = current.name; a.click();
    URL.revokeObjectURL(a.href);
  } catch { window.open(current.url, "_blank"); }
};
$("prompt").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey||e.metaKey)) generate(false); });
</script>
</body>
</html>
